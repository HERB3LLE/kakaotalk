
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messages</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
#app{max-width:520px;min-height:100dvh;margin:auto;background:#000;position:relative;overflow:hidden}
header{padding:calc(env(safe-area-inset-top) + 20px) 20px 0;background:#000}
#pageTitle{display:block;font-size:40px;line-height:1.15;font-weight:750;letter-spacing:-1.5px;padding:0 12px 18px}
.header-icons,#banner,nav{display:none}
#homeView{display:block;height:calc(100dvh - 100px);overflow-y:auto;padding-bottom:110px;scrollbar-width:none}
#homeView::-webkit-scrollbar{display:none}

.room{position:relative;display:flex;align-items:center;gap:25px;min-height:151px;padding:17px 26px 17px 32px;border:0;background:#000;color:#fff}
.room::after{content:"";position:absolute;height:1px;background:#38383a;left:172px;right:20px;bottom:0}
.avatar{width:93px;height:93px;border-radius:50%;background:linear-gradient(145deg,#625b78,#302b43);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;font-size:35px;color:#fff}
.avatar img{width:100%;height:100%;object-fit:cover}
.room-info{min-width:0;flex:1;align-self:center}
.room-name{font-weight:650;font-size:23px;line-height:1.25;margin-bottom:3px;color:#f5f5f7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview{font-size:18px;line-height:1.35;color:#8e8e93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{position:absolute;top:20px;right:42px;font-size:16px;color:#8e8e93}
.room::before{content:"›";position:absolute;right:20px;top:25px;color:#48484a;font-size:32px;line-height:1}

#composeButton{position:fixed;z-index:7;right:max(calc((100vw - 480px)/2 + 10px),20px);bottom:calc(env(safe-area-inset-bottom) + 18px);width:64px;height:64px;border-radius:50%;border:1px solid #444;background:rgba(48,48,50,.9);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

/* 채팅 화면 */
#chatView,#adminView{display:none;position:fixed;inset:0;background:#000;z-index:8;min-height:100dvh;max-width:520px;margin:auto;flex-direction:column;color:#fff}
#chatView{overflow:hidden}
.chat-head{height:118px;min-height:118px;position:relative;display:flex;align-items:flex-start;justify-content:center;padding-top:calc(env(safe-area-inset-top) + 10px);border:0;background:linear-gradient(to bottom,rgba(0,0,0,.94),rgba(0,0,0,.72));z-index:3}
.chat-head .back-circle{position:absolute;left:18px;top:calc(env(safe-area-inset-top) + 8px);width:52px;height:52px;border-radius:50%;border:1px solid #444;background:rgba(70,70,75,.65);color:#fff;font-size:38px;line-height:42px;padding:0;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.chat-profile{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:180px}
.chat-profile img,.chat-profile .profile-placeholder{width:74px;height:74px;border-radius:50%;object-fit:cover;background:linear-gradient(145deg,#625b78,#302b43)}
.chat-profile strong{font-size:13px;font-weight:600;color:#eee;background:rgba(70,70,75,.65);border:1px solid #444;border-radius:18px;padding:4px 12px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;backdrop-filter:blur(16px)}
#chatTitle{display:none}
#messages{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 24px;background:#000;display:flex;flex-direction:column;gap:2px;scrollbar-width:none}
#messages::-webkit-scrollbar{display:none}
.day-separator{align-self:center;color:#8e8e93;font-size:13px;font-weight:500;margin:12px 0 16px}
.msg{margin:3px 0;display:flex;flex-direction:column;align-items:flex-start;max-width:100%;width:100%}
.msg.mine{align-items:flex-end}
.msg-name{font-size:12px;color:#8e8e93;margin:0 0 4px 8px}
.bubble{position:relative;max-width:82%;padding:10px 15px;border-radius:22px;background:#26262b;color:#fff;line-height:1.38;overflow-wrap:anywhere;font-size:17px;white-space:pre-wrap}
.msg:not(.mine) .bubble{border-bottom-left-radius:7px}
.mine .bubble{background:#087eff;color:#fff;border-bottom-right-radius:7px}
.msg-time{font-size:10px;color:#8e8e93;margin:3px 7px 0}

#sendForm{position:relative;min-height:82px;display:flex;align-items:center;gap:9px;padding:9px 15px calc(12px + env(safe-area-inset-bottom));background:rgba(0,0,0,.96);border:0;z-index:4}
#sendInput{flex:1;min-width:0;height:48px;border:1px solid #555;border-radius:26px;padding:0 18px;background:rgba(48,48,52,.88);color:#fff;outline:0;font-size:17px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#sendInput::placeholder{color:#a1a1a6}
#sendForm button{width:38px;height:38px;flex-shrink:0;border:0;border-radius:50%;background:#087eff;color:white;font-size:22px;font-weight:700;padding:0}
#sendPlus{width:42px;height:42px;flex-shrink:0;border:1px solid #444;border-radius:50%;background:rgba(48,48,52,.85);color:#fff;font-size:30px;line-height:1}

.panel{padding:18px;overflow-y:auto;height:calc(100dvh - 60px);background:#fff;color:#111}
.panel input{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #d1d1d6;border-radius:9px;background:#f7f7f9;color:#111}
.action{padding:11px 14px;border:0;border-radius:9px;background:#087eff;color:#fff;font-weight:650;margin:4px 4px 4px 0}
.secondary{background:#e5e5ea;color:#111}
.admin-room,.thread{padding:13px;border-bottom:1px solid #e5e5ea}
.admin-room button,.thread button{margin-top:8px}
h3{font-size:16px;margin:20px 0 10px}
.small{color:#8e8e93;font-size:12px;line-height:1.5}
.hidden{display:none!important}

body>button{position:fixed!important;right:10px!important;bottom:10px!important;z-index:7!important;background:transparent!important;color:#a1a1a6!important;border:0!important;padding:5px 8px!important;font-size:10px!important}

#profileModal{display:none;position:fixed;inset:0;background:#0009;z-index:50;align-items:center;justify-content:center;padding:20px}
.profile-card{width:100%;max-width:360px;background:#fff;color:#111;border-radius:18px;padding:20px}
.profile-card h3{margin:0 0 18px}
.profile-card label{display:block;font-size:13px;color:#666;margin:12px 0 4px}
.profile-card input{width:100%;padding:12px;border:1px solid #d1d1d6;border-radius:9px;background:#f7f7f9;color:#111}
.profile-actions{display:flex;gap:8px;margin-top:18px}
.profile-actions button{flex:1}
.profile-preview{width:76px;height:76px;border-radius:50%;background:#eee;overflow:hidden;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:25px}
.profile-preview img{width:100%;height:100%;object-fit:cover}
@media(max-width:380px){
  .room{gap:15px;padding-left:20px}
  .avatar{width:72px;height:72px}
  .room::after{left:108px}
  .room-name{font-size:19px}
  .preview{font-size:15px}
}
</style>
</head>

<body>
<div id="app">
<header><span id="pageTitle">Messages</span></header>

<div id="homeView">
  <div id="banner"></div>
  <div id="roomList"></div>
</div>

<button id="composeButton" aria-label="새 메시지">✎</button>

<section id="chatView">
  <div class="chat-head">
    <button class="back-circle" id="backBtn" aria-label="뒤로">‹</button>
    <div class="chat-profile" id="chatProfile"></div>
    <strong id="chatTitle">Messages</strong>
  </div>
  <div id="messages"></div>
  <form id="sendForm">
    <button type="button" id="sendPlus" aria-label="추가">＋</button>
    <input id="sendInput" placeholder="Text Message · RCS" autocomplete="off">
    <button type="submit" aria-label="전송">↑</button>
  </form>
</section>

<section id="adminView">
  <div class="chat-head" style="height:60px;min-height:60px;align-items:center;padding:0 15px;justify-content:flex-start;background:#fafafa">
    <button id="adminBack" style="background:none;border:0;color:#087aff;font-size:30px">‹</button>
    <strong style="color:#111">관리자</strong>
  </div>
  <div class="panel" id="adminPanel">
    <div id="adminLogin">
      <h3>관리자 로그인</h3>
      <input id="adminEmail" type="email" placeholder="관리자 이메일">
      <input id="adminPassword" type="password" placeholder="비밀번호">
      <button class="action" id="loginBtn">로그인</button>
      <p class="small">관리자 계정은 Supabase에서 만든 계정을 사용해.</p>
    </div>

    <div id="adminTools" class="hidden">
      <h3>채팅방 관리</h3>
      <input id="newRoomName" placeholder="채팅방 이름">
      <input id="newPartnerName" placeholder="상대방 이름">
      <input id="newAvatar" placeholder="프로필 이미지 주소 (선택)">
      <button class="action" id="addRoomBtn">채팅방 만들기</button>

      <h3>배너 이미지 변경</h3>
      <input id="bannerUrl" placeholder="배너 이미지 주소">
      <button class="action" id="saveBanner">배너 적용</button>

      <h3>채팅방 목록</h3>
      <div id="adminRooms"></div>

      <h3>방문자 대화</h3>
      <div id="visitorThreads"></div>

      <button class="action secondary" id="logoutBtn">로그아웃</button>
    </div>
  </div>
</section>
</div>

<div id="profileModal">
  <div class="profile-card">
    <h3>채팅방 프로필 수정</h3>
    <div class="profile-preview" id="profilePreview">●</div>

    <label>채팅방 이름</label>
    <input id="editRoomName" placeholder="채팅방 이름">

    <label>상대방 이름</label>
    <input id="editPartnerName" placeholder="상대방 이름">

    <label>프로필 사진 주소</label>
    <input id="editAvatarUrl" placeholder="이미지 URL" inputmode="url">

    <div class="profile-actions">
      <button class="action secondary" id="cancelProfile">취소</button>
      <button class="action" id="saveProfile">저장</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL="https://ieblvlcqngmmiwpvrzoq.supabase.co";
const SUPABASE_KEY="sb_publishable_XFHlSKeuFq_OuXKrSzRU0A_uOA9c8VT";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;
let currentRoom=null;
let currentRoomName="";
let currentPartner="";
let currentVisitorId=null;
let isAdmin=false;
let realtimeChannel=null;
let roomsCache=[];
let editingRoomId=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

async function start(){
  const {data:{session}}=await db.auth.getSession();

  if(session){
    currentUser=session.user;
  }else{
    const {data,error}=await db.auth.signInAnonymously();

    if(error){
      alert("익명 인증에 실패했어요. Supabase의 Anonymous Sign-ins 설정을 확인해 주세요.\n"+error.message);
      return;
    }

    currentUser=data.user;
  }

  await loadRooms();
}

async function loadRooms(){
  const {data,error}=await db.from("rooms")
    .select("*")
    .order("sort_order")
    .order("created_at");

  if(error){
    $("roomList").textContent="채팅방을 불러오지 못했어요.";
    console.error(error);
    return;
  }

  roomsCache=data||[];
  renderRooms();

  if(isAdmin)renderAdminRooms();
}

function renderRooms(){
  $("roomList").innerHTML=roomsCache.map(r=>{
    const date=r.last_message_at||r.created_at;

    const dateText=date
      ? new Date(date).toLocaleDateString("en-US",{
          month:"numeric",
          day:"numeric",
          year:"2-digit"
        })
      : "";

    return `
      <div class="room" data-room="${r.id}" style="opacity:${r.is_open?1:.8}">
        <div class="avatar">
          ${r.avatar_url
            ? `<img src="${esc(r.avatar_url)}">`
            : "●"}
        </div>

        <div class="room-info">
          <div class="room-name">${esc(r.partner_name||r.room_name)}</div>
          <div class="preview">${esc(r.preview_text||"대화를 시작해 보세요.")}</div>
        </div>

        <div class="time">${dateText}</div>
      </div>
    `;
  }).join("");
}

$("roomList").addEventListener("click",async e=>{
  const item=e.target.closest("[data-room]");
  if(!item)return;

  const room=roomsCache.find(r=>String(r.id)===item.dataset.room);
  if(!room)return;

  if(!room.is_open){
    alert("아직 대화할 수 없는 채팅방이에요.");
    return;
  }

  if(!isAdmin){
    let name=localStorage.getItem("chat_display_name");

    if(!name){
      name=prompt("채팅에서 사용할 이름을 입력해 주세요.");
      if(!name||!name.trim())return;

      name=name.trim().slice(0,30);
      localStorage.setItem("chat_display_name",name);
    }

    currentVisitorId=currentUser.id;
  }

  await openChat(room);
});

async function openChat(room,visitorId=null){
  currentRoom=room.id;
  currentRoomName=room.room_name;
  currentPartner=room.partner_name;

  if(isAdmin){
    currentVisitorId=visitorId||currentVisitorId;

    if(!currentVisitorId){
      alert("방문자 대화를 먼저 선택해 주세요.");
      return;
    }
  }else{
    currentVisitorId=currentUser.id;
  }

  $("chatTitle").textContent=room.partner_name||room.room_name;

  $("chatProfile").innerHTML=room.avatar_url
    ? `<img src="${esc(room.avatar_url)}" alt=""><strong>${esc(room.partner_name||room.room_name)}</strong>`
    : `<div class="profile-placeholder"></div><strong>${esc(room.partner_name||room.room_name)}</strong>`;

  $("homeView").style.display="none";
  $("composeButton").style.display="none";
  $("chatView").style.display="flex";
  $("adminView").style.display="none";
  $("messages").innerHTML="";

  await loadMessages();

  if(realtimeChannel)await db.removeChannel(realtimeChannel);

  realtimeChannel=db.channel("chat-"+room.id+"-"+currentVisitorId);

  realtimeChannel.on("postgres_changes",{
    event:"INSERT",
    schema:"public",
    table:"messages",
    filter:"room_id=eq."+room.id
  },payload=>{
    const m=payload.new;
    if(m.visitor_id===currentVisitorId)appendMessage(m);
  }).subscribe();
}

function dayLabel(date){
  return new Date(date).toLocaleDateString("en-US",{
    month:"short",
    day:"numeric",
    year:"numeric"
  });
}

async function loadMessages(){
  let query=db.from("messages")
    .select("*")
    .eq("room_id",currentRoom)
    .order("created_at");

  if(!isAdmin){
    query=query.eq("visitor_id",currentUser.id);
  }else if(currentVisitorId){
    query=query.eq("visitor_id",currentVisitorId);
  }

  const {data,error}=await query;

  if(error){
    console.error(error);
    alert("메시지를 불러오지 못했어요: "+error.message);
    return;
  }

  $("messages").innerHTML="";
  let previousDay="";

  (data||[]).forEach(m=>{
    const day=dayLabel(m.created_at);

    if(day!==previousDay){
      const sep=document.createElement("div");
      sep.className="day-separator";
      sep.textContent=new Date(m.created_at).toLocaleString("en-US",{
        month:"short",
        day:"numeric",
        year:"numeric",
        hour:"numeric",
        minute:"2-digit"
      });

      $("messages").appendChild(sep);
      previousDay=day;
    }

    appendMessage(m);
  });
}

function appendMessage(m){
  if($("messages").querySelector('[data-message="'+m.id+'"]'))return;

  const mine=isAdmin
    ? m.sender_type==="admin"
    : m.sender_type==="visitor";

  const el=document.createElement("div");
  el.className="msg"+(mine?" mine":"");
  el.dataset.message=m.id;

  const time=new Date(m.created_at).toLocaleTimeString("ko-KR",{
    hour:"2-digit",
    minute:"2-digit"
  });

  el.innerHTML=`
    ${!mine?`<div class="msg-name">${esc(m.sender_name)}</div>`:""}
    <div class="bubble">${esc(m.content)}</div>
    <div class="msg-time">${time}</div>
  `;

  $("messages").appendChild(el);
  $("messages").scrollTop=$("messages").scrollHeight;
}

$("sendForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const content=$("sendInput").value.trim();
  if(!content||!currentRoom)return;

  const visitorId=isAdmin?currentVisitorId:currentUser?.id;

  if(!visitorId){
    alert("방문자 대화를 먼저 선택해 주세요.");
    return;
  }

  const senderName=isAdmin
    ? (currentPartner||"관리자")
    : (localStorage.getItem("chat_display_name")||"방문자");

  const {error}=await db.from("messages").insert({
    room_id:currentRoom,
    visitor_id:visitorId,
    sender_type:isAdmin?"admin":"visitor",
    sender_name:senderName,
    content
  });

  if(error){
    alert("메시지 전송 실패: "+error.message);
    return;
  }

  $("sendInput").value="";

  if(!isAdmin){
    await db.from("rooms").update({
      preview_text:content,
      last_message_at:new Date().toISOString()
    }).eq("id",currentRoom);
  }
});

$("sendPlus").onclick=()=>{
  alert("사진 첨부 기능은 아직 연결되어 있지 않아요.");
};

$("backBtn").onclick=async()=>{
  $("chatView").style.display="none";
  $("homeView").style.display="block";
  $("composeButton").style.display="flex";

  if(realtimeChannel)await db.removeChannel(realtimeChannel);

  currentRoom=null;
  currentVisitorId=null;

  await loadRooms();
};

$("adminBack").onclick=()=>{
  $("adminView").style.display="none";
  $("homeView").style.display="block";
  $("composeButton").style.display="flex";
};

async function openAdmin(){
  $("homeView").style.display="none";
  $("composeButton").style.display="none";
  $("chatView").style.display="none";
  $("adminView").style.display="flex";
}

$("loginBtn").onclick=async()=>{
  const email=$("adminEmail").value.trim();
  const password=$("adminPassword").value;

  const {data,error}=await db.auth.signInWithPassword({email,password});

  if(error){
    alert("로그인 실패: "+error.message);
    return;
  }

  currentUser=data.user;

  const {data:row,error:checkError}=await db.from("admin_users")
    .select("user_id")
    .eq("user_id",currentUser.id)
    .maybeSingle();

  if(checkError||!row){
    alert("관리자로 등록된 계정이 아니에요.");
    await db.auth.signOut();
    currentUser=null;
    await db.auth.signInAnonymously();
    return;
  }

  isAdmin=true;
  $("adminLogin").classList.add("hidden");
  $("adminTools").classList.remove("hidden");

  await loadRooms();
  await loadVisitorThreads();
};

async function loadVisitorThreads(){
  const {data,error}=await db.from("messages")
    .select("room_id,visitor_id,content,created_at,sender_name")
    .order("created_at",{ascending:false});

  if(error){
    $("visitorThreads").textContent="대화를 불러오지 못했어요: "+error.message;
    return;
  }

  const seen=new Set();
  const threads=[];

  for(const m of data||[]){
    const key=m.room_id+"_"+m.visitor_id;

    if(!seen.has(key)){
      seen.add(key);
      threads.push(m);
    }
  }

  $("visitorThreads").innerHTML=threads.map(t=>{
    const room=roomsCache.find(r=>r.id===t.room_id);

    return `
      <div class="thread">
        <strong>${esc(room?.room_name||"채팅방")}</strong>
        <div class="small">방문자 ID: ${esc(t.visitor_id)}</div>
        <div class="preview">${esc(t.content)}</div>
        <button class="action"
          data-thread-room="${t.room_id}"
          data-thread-visitor="${t.visitor_id}">
          대화 열기
        </button>
      </div>
    `;
  }).join("")||"<p class='small'>아직 방문자 대화가 없어요.</p>";
}

$("visitorThreads").addEventListener("click",async e=>{
  const b=e.target.closest("[data-thread-room]");
  if(!b)return;

  const room=roomsCache.find(r=>String(r.id)===b.dataset.threadRoom);
  const visitorId=b.dataset.threadVisitor;

  if(!room||!visitorId){
    alert("방문자 정보를 찾을 수 없어요.");
    return;
  }

  currentVisitorId=visitorId;
  await openChat(room,visitorId);
});

function renderAdminRooms(){
  $("adminRooms").innerHTML=roomsCache.map(r=>`
    <div class="admin-room">
      <strong>${esc(r.room_name)}</strong>
      <div class="small">${esc(r.partner_name)} · ${r.is_open?"대화 가능":"미리보기"}</div>
      <button class="action" data-toggle="${r.id}" data-open="${!r.is_open}">
        ${r.is_open?"대화 닫기":"대화 열기"}
      </button>
      <button class="action secondary" data-edit-room="${r.id}">
        프로필 수정
      </button>
    </div>
  `).join("");
}

function openProfileEditor(room){
  editingRoomId=room.id;
  $("editRoomName").value=room.room_name||"";
  $("editPartnerName").value=room.partner_name||"";
  $("editAvatarUrl").value=room.avatar_url||"";

  updateProfilePreview();
  $("profileModal").style.display="flex";
}

function closeProfileEditor(){
  $("profileModal").style.display="none";
  editingRoomId=null;
}

function updateProfilePreview(){
  const url=$("editAvatarUrl").value.trim();

  $("profilePreview").innerHTML=url
    ? `<img src="${esc(url)}" onerror="this.parentElement.textContent='이미지를 불러올 수 없어요'">`
    : "●";
}

$("editAvatarUrl").addEventListener("input",updateProfilePreview);
$("cancelProfile").onclick=closeProfileEditor;

$("profileModal").addEventListener("click",e=>{
  if(e.target===$("profileModal"))closeProfileEditor();
});

$("saveProfile").onclick=async()=>{
  if(!editingRoomId)return;

  const room_name=$("editRoomName").value.trim();
  const partner_name=$("editPartnerName").value.trim();
  const avatar_url=$("editAvatarUrl").value.trim();

  if(!room_name||!partner_name){
    alert("채팅방 이름과 상대방 이름을 입력해 주세요.");
    return;
  }

  const btn=$("saveProfile");
  btn.disabled=true;
  btn.textContent="저장 중...";

  const {data,error}=await db.from("rooms")
    .update({room_name,partner_name,avatar_url})
    .eq("id",editingRoomId)
    .select();

  btn.disabled=false;
  btn.textContent="저장";

  if(error){
    alert("프로필 수정 실패: "+error.message);
    return;
  }

  if(!data||data.length===0){
    alert("수정 권한이 없거나 해당 채팅방을 찾을 수 없어요. Supabase의 rooms UPDATE 정책을 확인해 주세요.");
    return;
  }

  closeProfileEditor();
  await loadRooms();
  alert("채팅방 프로필을 수정했어요!");
};

$("adminRooms").addEventListener("click",async e=>{
  const edit=e.target.closest("[data-edit-room]");

  if(edit){
    const room=roomsCache.find(r=>String(r.id)===edit.dataset.editRoom);
    if(room)openProfileEditor(room);
    return;
  }

  const b=e.target.closest("[data-toggle]");
  if(!b)return;

  const {error}=await db.from("rooms")
    .update({is_open:b.dataset.open==="true"})
    .eq("id",b.dataset.toggle);

  if(error)alert(error.message);
  else await loadRooms();
});

$("addRoomBtn").onclick=async()=>{
  const room_name=$("newRoomName").value.trim();
  const partner_name=$("newPartnerName").value.trim();
  const avatar_url=$("newAvatar").value.trim();

  if(!room_name||!partner_name){
    alert("채팅방 이름과 상대방 이름을 입력해 주세요.");
    return;
  }

  const {error}=await db.from("rooms").insert({
    room_name,
    partner_name,
    avatar_url,
    is_open:false,
    preview_text:"대화를 시작해 보세요.",
    sort_order:roomsCache.length
  });

  if(error){
    alert("채팅방 생성 실패: "+error.message);
  }else{
    $("newRoomName").value="";
    $("newPartnerName").value="";
    $("newAvatar").value="";
    await loadRooms();
  }
};

$("saveBanner").onclick=()=>{
  const url=$("bannerUrl").value.trim();
  if(!url)return;
  $("banner").innerHTML=`<img src="${esc(url)}" alt="배너">`;
};

$("logoutBtn").onclick=async()=>{
  await db.auth.signOut();

  isAdmin=false;
  currentUser=null;
  currentVisitorId=null;

  $("adminTools").classList.add("hidden");
  $("adminLogin").classList.remove("hidden");
  $("adminView").style.display="none";
  $("homeView").style.display="block";
  $("composeButton").style.display="flex";

  const {data,error}=await db.auth.signInAnonymously();
  if(!error)currentUser=data.user;

  await loadRooms();
};

const adminButton=document.createElement("button");
adminButton.textContent="관리자";
adminButton.style.cssText="position:fixed;right:12px;bottom:12px;z-index:7;background:transparent;color:#aaa;border:0;padding:8px;font-size:10px";
adminButton.onclick=openAdmin;
document.body.appendChild(adminButton);

$("composeButton").onclick=()=>{
  alert("새 메시지를 시작하려면 채팅방을 선택해 주세요.");
};

start();
</script>
</body>
</html>
