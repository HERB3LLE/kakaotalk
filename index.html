
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chats</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
header{padding:24px 18px 12px;position:sticky;top:0;background:#090909;z-index:2}
h1{font-size:32px;margin:8px 0 22px}
.top{display:flex;justify-content:space-between;align-items:center}
.icons{display:flex;gap:18px}
button{border:0;color:inherit;cursor:pointer}
.icons button{font-size:25px;background:none}
#search{display:none;width:100%;padding:12px;background:#222;border:0;border-radius:12px;color:white;margin-bottom:12px}
.tabs{display:flex;gap:8px;overflow:auto}
.tab{background:#292929;border-radius:30px;padding:12px 19px;white-space:nowrap}
.tab.active{background:#f4f4f4;color:#111}
#list{padding:4px 12px 85px}
.person{width:100%;display:flex;align-items:center;text-align:left;gap:13px;background:none;padding:14px 4px}
.avatar{width:56px;height:56px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:#fee500;color:#222;font-size:23px}
.info{flex:1;min-width:0}
.name{font-size:16px;margin-bottom:7px}
.preview{color:#999;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:11px;color:#888;align-self:flex-start;padding-top:4px}
nav{position:fixed;bottom:0;left:0;right:0;background:#090909;display:flex;justify-content:space-around;padding:15px;border-top:1px solid #222}
nav button{background:none;color:#aaa;font-size:23px}
#room{display:none;position:fixed;inset:0;background:#101010;z-index:5;flex-direction:column}
.roomhead{padding:16px;display:flex;align-items:center;gap:18px;border-bottom:1px solid #292929}
.roomhead button{font-size:27px;background:none}
#roomname{font-weight:bold;flex:1}
#messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:13px}
.msg{max-width:82%;align-self:flex-start;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end}
.sender{font-size:12px;color:#aaa;margin-bottom:5px}
.bubble{padding:11px 14px;background:#303030;border-radius:4px 17px 17px 17px;white-space:pre-wrap}
.mine .bubble{background:#fee500;color:#222;border-radius:17px 4px 17px 17px}
.quote{background:#202020;padding:8px;font-size:12px;color:#ccc;margin-bottom:5px;border-left:3px solid #999}
.mine .quote{color:#554d00;background:#dfca00}
.msg img{max-width:210px;border-radius:10px}
.msgtime{font-size:10px;color:#888;margin-top:4px}
#replybar{display:none;background:#252525;padding:10px;font-size:12px;color:#ccc}
#replybar button{float:right;background:none}
.composer{display:flex;gap:8px;align-items:center;padding:10px;background:#191919}
.composer button{font-size:22px;background:none}
#text{flex:1;min-width:0;background:#303030;color:white;border:0;border-radius:22px;padding:13px;outline:none}
#settings{display:none;position:fixed;inset:0;background:#090909;z-index:9;padding:24px}
#settings input{width:100%;padding:13px;margin:8px 0;background:#222;border:0;border-radius:8px;color:white}
.action{padding:12px 16px;background:#fee500;color:#222;border-radius:8px;margin:8px 5px 0 0}
</style>
</head>
<body>
<header>
 <div class="top"><h1>Chats</h1><div class="icons">
 <button id="searchBtn">⌕</button><button id="newBtn">＋</button><button id="settingsBtn">⚙</button>
 </div></div>
 <input id="search" placeholder="채팅 검색">
 <div class="tabs">
 <button class="tab active" data-filter="all">All</button>
 <button class="tab" data-filter="unread">Unread</button>
 <button class="tab" data-filter="ChatGPT">ChatGPT</button>
 <button class="tab" data-filter="Calls">Calls</button>
 </div>
</header>
<main id="list"></main>
<nav><button>●</button><button>▤</button><button>◉</button><button>▣</button><button>•••</button></nav>

<section id="room">
 <div class="roomhead"><button id="back">‹</button><div id="roomname">채팅</div><button id="roomMenu">⋮</button></div>
 <div id="messages"></div>
 <div id="replybar"><span id="replytext"></span><button id="cancelReply">✕</button></div>
 <div class="composer">
  <button id="photoBtn">＋</button><input id="photo" type="file" accept="image/*" hidden>
  <input id="text" placeholder="메시지 입력"><button id="send">➤</button>
 </div>
</section>

<section id="settings">
 <h2>설정</h2>
 <input id="nickname" placeholder="내 닉네임">
 <input id="keyword" placeholder="자동 답장 키워드">
 <input id="autoReply" placeholder="자동 답장 내용">
 <button class="action" id="saveSettings">저장</button>
 <button class="action" id="closeSettings">닫기</button>
</section>

<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL="https://zryktbxfiecxbozsnild.supabase.co";
const SUPABASE_KEY="sb_publishable_C-0Tcm_oQ9ugynZe5ueERg_IODhXMh_";
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let uid=localStorage.getItem("chat_uid");
if(!uid){uid=crypto.randomUUID();localStorage.setItem("chat_uid",uid)}
let nickname=localStorage.getItem("chat_name")||"사용자"+uid.slice(0,4);
let current=null,reply=null,channel=null,filter="all";
let rules=JSON.parse(localStorage.getItem("chat_rules")||"[]");
let profiles=[];
const samples=[
 {name:"벨띠 💗",icon:"💗",preview:"ㅋㅋㅋㅋㅋㅋ"},
 {name:"Natty",icon:"🐶",preview:"오늘 뭐 해?"},
 {name:"Belle",icon:"🌷",preview:"사진"},
 {name:"우리들의 채팅",icon:"🫧",preview:"다들 어디야?"},
 {name:"Haneul",icon:"🌙",preview:"잘 자아 🌙"},
 {name:"Julie",icon:"🍒",preview:"내일 봐!!"},
 {name:"KISSY 💌",icon:"💌",preview:"새로운 메시지"},
 {name:"나만의 채팅",icon:"📝",preview:"메모를 남겨 보세요"}
];
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function time(t){return new Date(t).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}
function roomId(id){return "room_"+id}
function renderList(){
 const list=$("list");list.innerHTML="";
 let rows=samples.map((s,i)=>({...s,id:roomId("sample"+i),sample:true}));
 if(filter==="unread"||filter==="Calls")rows=[];
 const q=$("search").value.toLowerCase();
 rows=rows.filter(x=>x.name.toLowerCase().includes(q));
 rows.forEach(s=>{
  const b=document.createElement("button");b.className="person";
  b.innerHTML=`<div class="avatar">${s.icon}</div><div class="info"><div class="name">${esc(s.name)}</div><div class="preview">${esc(s.preview)}</div></div><div class="time">오후 ${11-rows.indexOf(s)}:00</div>`;
  b.onclick=()=>openRoom(s);
  list.appendChild(b);
 });
 if(!rows.length)list.innerHTML='<p style="color:#888;text-align:center;padding:30px">채팅방이 없어.</p>';
}
function draw(msgs){
 $("messages").innerHTML="";
 msgs.forEach(m=>show(m));
 $("messages").scrollTop=$("messages").scrollHeight;
}
function show(m){
 const el=document.createElement("div");
 el.className="msg"+(m.sender_id===uid?" mine":"");
 el.innerHTML=(m.sender_id===uid?"":`<div class="sender">${esc(m.sender_name)}</div>`)+
 (m.reply_text?`<div class="quote">↪ ${esc(m.reply_name||"메시지")}<br>${esc(m.reply_text)}</div>`:"")+
 (m.text?`<div class="bubble">${esc(m.text)}</div>`:"")+
 (m.image_url?`<img src="${esc(m.image_url)}" alt="사진">`:"")+
 `<div class="msgtime">${time(m.created_at||m.time||Date.now())}</div>`;
 el.onclick=()=>{reply={id:m.id,text:m.text||"사진",name:m.sender_name};$("replytext").textContent="답장: "+reply.name+" · "+reply.text;$("replybar").style.display="block"};
 $("messages").appendChild(el);
}
async function openRoom(s){
 current=s;$("roomname").textContent=s.name;$("room").style.display="flex";
 if(channel){await db.removeChannel(channel);channel=null}
 const {data,error}=await db.from("messages").select("*").eq("chat_id",s.id).order("created_at");
 if(error){alert("메시지 불러오기 실패: "+error.message);return}
 draw(data||[]);
 channel=db.channel("room-"+s.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"chat_id=eq."+s.id},payload=>{
  show(payload.new);$("messages").scrollTop=$("messages").scrollHeight;
  const r=rules.find(x=>x.keyword&&payload.new.text?.includes(x.keyword)&&x.reply);
  if(payload.new.sender_id!==uid&&r)setTimeout(()=>send(r.reply,true),500);
 }).subscribe();
}
async function send(text,automatic=false,imageUrl=null){
 if(!current||(!text.trim()&&!imageUrl))return;
 const {error}=await db.from("messages").insert({
  chat_id:current.id,sender_id:uid,sender_name:nickname,text:text.trim(),
  image_url:imageUrl,reply_to:reply?.id?String(reply.id):null,
  reply_text:reply?.text||null,reply_name:reply?.name||null
 });
 if(error){alert("전송 실패: "+error.message);return}
 if(!automatic){$("text").value="";reply=null;$("replybar").style.display="none"}
}
$("send").onclick=()=>send($("text").value);
$("text").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();send($("text").value)}};
$("back").onclick=async()=>{$("room").style.display="none";if(channel)await db.removeChannel(channel);channel=null;current=null};
$("cancelReply").onclick=()=>{reply=null;$("replybar").style.display="none"};
$("searchBtn").onclick=()=>{$("search").style.display=$("search").style.display==="block"?"none":"block";$("search").focus()};
$("search").oninput=renderList;
$("newBtn").onclick=()=>alert("현재 기본 채팅방 목록을 표시하고 있어. 실제 사람을 선택하는 기능은 다음 단계에서 연결할 수 있어.");
$("settingsBtn").onclick=()=>{$("nickname").value=nickname;$("keyword").value=rules[0]?.keyword||"";$("autoReply").value=rules[0]?.reply||"";$("settings").style.display="block"};
$("closeSettings").onclick=()=>$("settings").style.display="none";
$("saveSettings").onclick=()=>{nickname=$("nickname").value.trim()||nickname;localStorage.setItem("chat_name",nickname);const k=$("keyword").value.trim(),r=$("autoReply").value.trim();rules=k&&r?[{keyword:k,reply:r}]:[];localStorage.setItem("chat_rules",JSON.stringify(rules));$("settings").style.display="none"};
$("photoBtn").onclick=()=>$("photo").click();
$("photo").onchange=async e=>{
 const f=e.target.files[0];if(!f||!current)return;
 if(f.size>4*1024*1024){alert("사진은 4MB 이하로 선택해 줘.");return}
 const path=uid+"/"+Date.now()+"_"+f.name;
 const {error}=await db.storage.from("chat-images").upload(path,f);
 if(error){alert("사진 전송을 위해 Supabase Storage에 chat-images 버킷이 필요해.");return}
 const {data}=db.storage.from("chat-images").getPublicUrl(path);
 await send("",false,data.publicUrl);e.target.value="";
};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;renderList()});
renderList();
</script>
</body>
</html>
